<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Csengetési rend</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="header">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    <span class="header-title">Csengetési rend</span>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="schedule">Csengetési rend</button>
    <button class="tab" data-tab="media">Média</button>
    <button class="tab" data-tab="time">Idő</button>
    <button class="tab" data-tab="output">Kimenet</button>
    <button class="tab" data-tab="log">Napló</button>
  </div>

  <div class="content">

    <!-- Csengetesi rend -->
    <section class="panel active" id="panel-schedule">
      <div class="toolbar">
        <label class="field-label" for="scheduleSelect">Aktív rend</label>
        <select id="scheduleSelect" class="select"></select>
        <button class="btn btn-ghost" id="btnRefreshSchedules">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
          Újratöltés
        </button>
        <button class="btn btn-ghost" id="btnNewSchedule">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Új rend
        </button>
      </div>

      <div class="table-card">
        <table class="table">
          <thead>
            <tr><th style="width:180px">IDŐPONT</th><th>FÁJLNÉV</th></tr>
          </thead>
          <tbody id="eventsTbody"></tbody>
        </table>
      </div>

      <div class="edit-hint" id="editHint"></div>

      <div class="form-card">
        <div class="form-row">
          <div class="form-field">
            <label class="field-label" for="eventTime">Időpont</label>
            <input class="input" id="eventTime" type="text" placeholder="07:45" style="width:90px">
          </div>
          <div class="form-field grow">
            <label class="field-label" for="eventFile">Fájl</label>
            <select class="select" id="eventFile" style="width:100%"></select>
          </div>
          <button class="btn btn-ghost" id="btnAddEvent">Esemény hozzáadás</button>
          <button class="btn btn-ghost" id="btnCancelEdit" style="display:none">Mégse</button>
          <button class="btn btn-danger" id="btnRemoveEvent">Kijelölt törlése</button>
          <button class="btn btn-danger-solid" id="btnRemoveAllEvents">Összes törlése</button>
        </div>
        <div class="selection-hint">Többszörös kijelölés: Ctrl+klikk (egyenként), Shift+klikk (tartomány)</div>
      </div>

      <div class="save-row">
        <button class="btn btn-ghost btn-tall" id="btnRingNow">Manuális csengetés indítása most</button>
        <button class="btn btn-primary btn-tall" id="btnSaveSchedule">Rend mentése</button>
      </div>
    </section>

    <!-- Media -->
    <section class="panel" id="panel-media">
      <div class="toolbar">
        <button class="btn btn-primary" id="btnUploadMedia">Hangfájl feltöltése...</button>
        <input type="file" id="fileInput" accept=".mp3,.wav,.ogg" style="display:none">
        <button class="btn btn-ghost" id="btnRefreshMedia">Lista frissítése</button>
      </div>

      <div class="table-card list-card">
        <select class="listbox" id="mediaListbox" size="14"></select>
      </div>

      <div class="media-bottom">
        <button class="btn btn-ghost" id="btnPlaySelected">Kijelölt lejátszása (manuális teszt)</button>
        <label class="switch-row">
          <span class="switch">
            <input type="checkbox" id="forcePlay">
            <span class="switch-slider"></span>
          </span>
          <span class="switch-label">Force lejátszás (megszakítja a folyamatban lévőt)</span>
        </label>
      </div>

      <div class="form-card">
        <div class="form-row">
          <span class="field-label bold">Alapértelmezett csengőhang</span>
          <select class="select" id="defaultMediaSelect" style="width:260px"></select>
          <button class="btn btn-ghost" id="btnSaveDefaultMedia">Mentés alapértelmezettként</button>
        </div>
      </div>

      <div class="form-card">
        <div class="form-row">
          <span class="field-label bold">Max. feltölthető fájlméret (MB)</span>
          <input class="input" id="uploadLimitInput" type="number" min="1" max="1024" step="1" style="width:100px">
          <button class="btn btn-ghost" id="btnSaveUploadLimit">Mentés</button>
        </div>
      </div>
    </section>

    <!-- Ido -->
    <section class="panel" id="panel-time">
      <div class="form-card">
        <div class="mode-row">
          <label class="radio-row"><input type="radio" name="timeMode" value="ntp" id="modeNtp"> NTP</label>
          <label class="radio-row"><input type="radio" name="timeMode" value="manual" id="modeManual"> Kézi</label>
        </div>

        <div class="time-grid">
          <label class="field-label">NTP szerver</label>
          <input class="input" id="ntpServer" type="text" style="width:220px">
          <button class="btn btn-ghost" id="btnSyncNtp">Frissítés most</button>

          <label class="field-label">Kézi dátum/idő (YYYY-MM-DD HH:MM:SS)</label>
          <input class="input" id="manualTime" type="text" style="width:190px">
          <button class="btn btn-ghost" id="btnApplyManual">Alkalmaz</button>
        </div>

        <div class="current-time" id="currentTime">Aktuális számított idő: -</div>
      </div>
    </section>

    <!-- Kimenet -->
    <section class="panel" id="panel-output">
      <div class="form-card">
        <span class="field-label bold">Kimeneti eszköz</span>
        <select class="select" id="deviceSelect" style="width:420px; margin-left:10px"></select>
      </div>

      <div class="form-card">
        <div class="volume-label" id="volumeLabel">Hangerő: 100%</div>
        <input type="range" id="volumeSlider" class="slider" min="0" max="200" step="1" value="100">
        <div class="scale-row">
          <span>0%</span>
          <span class="scale-mid">100% (normál)</span>
          <span class="scale-boost">200% (boost)</span>
        </div>
      </div>
    </section>

    <!-- Naplo -->
    <section class="panel" id="panel-log">
      <pre class="log-box" id="logBox"></pre>
    </section>

  </div>
</div>

<div class="alert-overlay" id="alertOverlay">
  <div class="alert-box">
    <div class="alert-title" id="alertTitle"></div>
    <div class="alert-detail" id="alertDetail"></div>
    <button class="btn btn-ghost" id="alertOk">OK</button>
  </div>
</div>

<div class="alert-overlay modal-overlay" id="modalOverlay">
  <div class="alert-box modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="alert-title" id="modalTitle"></div>
    <div class="alert-detail" id="modalMessage"></div>
    <input class="input modal-input" id="modalInput" type="text" style="display:none">
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modalCancel">Mégse</button>
      <button class="btn btn-primary" id="modalOk">OK</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
